<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpreSQL — ERD preview (Mermaid)</title>
    <style>
        html, body { height: 100%; width: 100%; padding: 0; margin: 0; font-family: sans-serif; }
        .container { display: flex; height: 100%; }
        #esql {
            width: 18%;
            padding: 16px;
            overflow: auto;
            font-size: 13px;
            font-family: monospace;
            border-right: 1px solid #ddd;
            background: #f8f8f8;
            white-space: pre;
        }
        #diagram {
            flex: 1;
            padding: 20px;
            overflow: auto;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        @media (prefers-color-scheme: dark) {
            html, body { background: #1e1e2e; color: #cdd6f4; }
            #esql { background: #181825; border-color: #313244; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="esql"></div>
        <div id="diagram"><div id="mermaid-target"></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script type="module">
        import { toERD } from '../../dist/expresql.js';

        const input = `departments {GROUP "HR"}
    name /nn
    location
    country
employees {GROUP "HR"}
    departments_id /fk departments
    name /nn vc50
    email /lower
    cost_center num
    date_hired date
    job vc255
projects {GROUP "PM"}
    name /nn vc100
    budget num
    start_date date
tasks {GROUP "PM"}
    projects_id /fk projects
    name /nn vc255
    status vc20
    assigned_to vc100

view emp_v departments employees`;

        document.getElementById('esql').textContent = input;

        function erdToMermaid(erd) {
            const safeId = s => s.replace(/[^a-zA-Z0-9_]/g, '_');
            const lines = ['erDiagram'];
            for (const item of erd.items) {
                lines.push(`    ${safeId(item.name)} {`);
                for (const col of item.columns) {
                    const t = col.datatype.replace(/[^a-zA-Z0-9_(),.]/g, '_');
                    lines.push(`        ${t} ${safeId(col.name)}`);
                }
                lines.push('    }');
            }
            const seen = new Set();
            for (const link of erd.links) {
                const key = link.source + '->' + link.target;
                if (seen.has(key)) continue;
                seen.add(key);
                const card = link.mandatory ? '||--o{' : '|o--o{';
                lines.push(`    ${safeId(link.source)} ${card} ${safeId(link.target)} : ""`);
            }
            return lines.join('\n');
        }

        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'loose' });

        const erd = toERD(input);
        const mmd = erdToMermaid(erd);
        const { svg } = await mermaid.render('erd-svg', mmd);
        document.getElementById('mermaid-target').innerHTML = svg;
    </script>
</body>
</html>
